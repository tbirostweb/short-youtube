server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # En-têtes de sécurité. HTTPS et HSTS sont gérés par le proxy Dokploy.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  # Le front n'appelle que sa propre origine : aucune ressource distante,
  # donc aucune clé d'API ne peut transiter par le navigateur.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Les fichiers versionnés par Vite sont immuables.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Résolveur DNS interne de Docker : l'adresse du service api est réévaluée
  # régulièrement, donc un redémarrage du conteneur api ne casse pas nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Envoi de fichier vidéo : gros corps de requête, transmis en flux.
  # Sans proxy_request_buffering off, nginx écrirait tout le fichier sur son
  # propre disque avant de le transmettre à l'api.
  location = /api/uploads {
    set $api_uploads http://api:3000;
    proxy_pass $api_uploads;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Doit rester supérieur ou égal à MAX_UPLOAD_MB.
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # API et flux SSE : proxy vers le service api.
  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Indispensable pour le flux d'événements : pas de tampon, pas de timeout court.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 1m;
  }

  location = /health {
    set $api_health http://api:3000;
    proxy_pass $api_health;
    proxy_set_header Host $host;
  }

  # Repli SPA : toute autre route est servie par index.html (Vue Router gère le 404).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
